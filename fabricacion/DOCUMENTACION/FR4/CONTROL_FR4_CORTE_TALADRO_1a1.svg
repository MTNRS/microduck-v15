ill="none" stroke="#999" stroke-width=".08" stroke-dasharray=".5,.3" /><rect x="5.3" y="9.299999999999988" width="2.4" height="1.8" fill="none" stroke="#999" stroke-width=".08" stroke-dasharray=".5,.3" /><rect x="9.5" y="3.2" width="6.0" height="6.0" fill="none" stroke="#999" stroke-width=".08" stroke-dasharray=".5,.3" /></g><text x="80" y="42.0" fill="#111" font-family="Arial, sans-serif" font-size="2.6">M2_LEFT: u3.5000, v4.7000, diam2.2000</text><text x="80" y="47.0" fill="#111" font-family="Arial, sans-serif" font-size="2.6">M2_RIGHT: u23.5000, v4.7000, diam2.2000</text><text x="12" y="90.0" fill="#111" font-family="Arial, sans-serif" font-size="2.8">2 x diam2.20. Gris = asignacion de componentes, NO taladro.</text><text x="12" y="95.0" fill="#111" font-family="Arial, sans-serif" font-size="2.8">Q1:2N3906; confirmar patillaje del fabricante suministrado.</text><text x="12" y="100.0" fill="#111" font-family="Arial, sans-serif" font-size="2.8">7 resistores0805: conexion punto a punto segun netlist.</text><text x="12" y="105.0" fill="#111" font-family="Arial, sans-serif" font-size="2.8">No cobre de potencia ni conexion a B- crudo en esta placa.</text><text x="12" y="110.0" fill="#111" font-family="Arial, sans-serif" font-size="2.8">Mapa de componentes/valores y conexiones en README_FR4 y FR4_MANIFEST.json.</text><text x="12" y="119" fill="#111" font-family="Arial, sans-serif" font-size="2.8">Negro: cortar contorno. Azul: taladrar centros. Gris: referencia, NO taladrar.</text><line x1="25" y1="132" x2="125" y2="132" stroke="black" stroke-width=".15" /><line x1="25" y1="129" x2="25" y2="135" stroke="black" stroke-width=".15" /><line x1="125" y1="129" x2="125" y2="135" stroke="black" stroke-width=".15" /><text x="63" y="128" fill="#111" font-family="Arial, sans-serif" font-size="3.0">100.00mm</text><rect x="170" y="125" width="10" height="10" fill="none" stroke="black" stroke-width=".15" /><text x="163" y="122" fill="#111" font-family="Arial, sans-serif" font-size="2.